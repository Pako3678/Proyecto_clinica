spring.application.name=clinica-api

# --- Conexion a MySQL ---
# Crear antes la base con: CREATE DATABASE clinica_db;
spring.datasource.url=jdbc:mysql://localhost:3306/clinica_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: crea/actualiza tablas automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Carga de datos de ejemplo (solo la primera vez que se crean las tablas) ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080
